name: Typst Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Typst PDFs
    container: ghcr.io/typst/typst
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Compile Typst to PDFs
        run: |
          mkdir -p build/notes
          : > titles.tsv
          for typ_file in */*.typ; do
            if grep -q '#import "../mono.typ"' "$typ_file"; then
              course_name=$(dirname "$typ_file")
              title=$(grep -m1 'template.with(' "$typ_file" | sed -E 's/.*\[(.*)\].*/\1/')
              typst compile --root . "$typ_file" "build/notes/${course_name}.pdf"
              printf '%s\t%s\n' "$course_name" "$title" >> titles.tsv
            fi
          done

      - name: Generate Index
        run: |
          echo "<!DOCTYPE html><html><head><title>Course Notes</title><style>body{font-family:sans-serif;padding:20px;}ul{list-style:none;padding:0;}li{margin:10px 0;}a{text-decoration:none;color:#00aa88;font-weight:bold;}a:hover{text-decoration:underline;}</style></head><body><h1>Course Notes</h1><ul>" > build/index.html
          while IFS=$'\t' read -r name title; do
            echo "<li><a href=\"notes/$name.pdf\">$title</a></li>" >> build/index.html
          done < titles.tsv
          echo "</ul></body></html>" >> build/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@main
        with:
          name: pdfs
          path: build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Download artifacts
        uses: actions/download-artifact@main
        with:
          name: pdfs
          path: site
      - name: Setup Pages
        uses: actions/configure-pages@main
      - name: Upload artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
